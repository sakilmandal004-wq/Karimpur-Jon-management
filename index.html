<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GMDS | Zone Command & Dispatch Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;box-sizing:border-box;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation}
html,body{overscroll-behavior-y:none;background:#eef2f1;font-family:'Plus Jakarta Sans',sans-serif}
select{-webkit-appearance:none;appearance:none;background:#f8fafc url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e") no-repeat right .6rem center/.8em}
.card{border-left:4px solid #f59e0b}.card.active{border-left-color:#3b82f6}.card.delivered{border-left-color:#10b981;background:#f0fdf4}.card.cancelled{border-left-color:#ef4444;background:#fff1f2}
.tab-on{background:#047857;color:#fff}
</style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased" oncontextmenu="return false;">
<audio id="snd" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
<div id="toasts" class="fixed top-3 right-3 z-[100000] pointer-events-none flex flex-col gap-2 max-w-[92vw]"></div>

<div id="login" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
    <h2 class="text-lg font-extrabold m-0">Zone Command Login</h2>
    <p class="text-xs text-slate-400 mb-4">Select your operational zone and enter the security PIN.</p>
    <select id="zoneSel" class="w-full border-2 border-slate-200 rounded-2xl p-3 text-xs font-bold mb-3">
      <option value="Jon1">Zone 1 (Jon1)</option><option value="Jon2">Zone 2 (Jon2)</option><option value="Jon3">Zone 3 (Jon3)</option>
      <option value="Jon4">Zone 4 (Jon4)</option><option value="Jon5">Zone 5 (Jon5)</option><option value="Jon6">Zone 6 (Jon6)</option>
      <option value="Fazilnagar">Fazilnagar (Direct)</option>
    </select>
    <input type="password" id="pinIn" placeholder="Zone PIN" class="w-full border-2 border-slate-200 rounded-2xl p-3 text-xs font-bold mb-3 outline-none focus:border-emerald-600">
    <button onclick="login()" class="w-full bg-emerald-700 text-white font-extrabold py-3.5 rounded-2xl text-xs border-none cursor-pointer">Open Dashboard</button>
  </div>
</div>

<div id="riderModal" class="fixed inset-0 bg-slate-950/80 z-50 hidden items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl">
    <div class="flex justify-between items-center mb-3"><div><h3 class="font-extrabold text-sm m-0">Assign Delivery Rider</h3><p class="text-[11px] text-slate-400 font-bold m-0" id="riderOrderLbl"></p></div>
      <button onclick="closeRider()" class="w-8 h-8 rounded-full bg-slate-100 border-none cursor-pointer"><i class="fas fa-times"></i></button></div>
    <select id="riderDir" onchange="pickDirRider(this.value)" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs font-bold mb-2"><option value="">-- Select saved rider --</option></select>
    <input id="rName" placeholder="Rider name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold mb-2 outline-none">
    <input id="rPhone" type="tel" placeholder="Phone (10 digits)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold mb-2 outline-none">
    <select id="rVeh" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs font-bold mb-3"><option value="Bike">Bike</option><option value="E-Rickshaw (Toto)">E-Rickshaw (Toto)</option><option value="Cycle">Cycle</option></select>
    <button onclick="saveRider()" class="w-full bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs border-none cursor-pointer">Save & Assign Rider</button>
  </div>
</div>

<div id="waModal" class="fixed inset-0 bg-slate-950/80 z-50 hidden items-center justify-center p-3">
  <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
    <div class="p-3.5 flex items-center justify-between border-b border-slate-100 bg-slate-50">
      <div><h3 class="font-extrabold text-xs m-0"><i class="fab fa-whatsapp text-[#25D366]"></i> WhatsApp Dispatch</h3><p class="text-[10px] text-slate-500 font-bold m-0" id="waTarget"></p></div>
      <button onclick="closeWa()" class="w-7 h-7 rounded-full bg-slate-100 border-none cursor-pointer"><i class="fas fa-times text-xs"></i></button>
    </div>
    <div class="p-3 flex-1 flex"><textarea id="waText" class="w-full min-h-[260px] p-3 text-xs font-mono bg-slate-50 border-2 border-slate-200 rounded-2xl resize-none leading-relaxed" spellcheck="false"></textarea></div>
    <div class="p-3 bg-slate-50 border-t border-slate-100 flex gap-2">
      <button onclick="copyWa()" class="w-1/3 py-3 bg-white border border-slate-200 rounded-xl text-xs font-bold cursor-pointer"><i class="fas fa-copy"></i> Copy</button>
      <button id="waSend" class="w-2/3 py-3 bg-[#25D366] text-white rounded-xl text-xs font-extrabold border-none cursor-pointer"><i class="fab fa-whatsapp"></i> Send via WhatsApp</button>
    </div>
  </div>
</div>

<header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
  <div class="px-3 py-2.5 flex items-center justify-between">
    <div><h1 class="text-xs font-extrabold m-0">GMDS ZONE COMMAND</h1><p class="text-[10px] text-emerald-400 font-bold m-0">Zone: <span id="zoneLbl" class="text-amber-300">--</span></p></div>
    <div class="flex gap-1.5">
      <button onclick="fetchAll(true)" class="bg-slate-800 text-emerald-400 border border-slate-700 px-3 py-2 rounded-xl font-bold text-xs cursor-pointer"><i class="fas fa-rotate"></i> Sync</button>
      <button onclick="logout()" class="bg-red-500/20 text-red-300 border border-red-500/30 px-3 py-2 rounded-xl text-xs cursor-pointer" title="Switch zone / logout"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="px-3 pb-2.5 flex gap-1.5 items-center">
    <input type="date" id="dateIn" onchange="setDate(this.value)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs font-bold text-emerald-300 outline-none">
    <button onclick="setToday()" class="bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold border-none cursor-pointer">Today</button>
    <button onclick="setDate('')" class="bg-slate-700 text-white px-3 py-2 rounded-xl text-xs font-bold border-none cursor-pointer">All</button>
  </div>
</header>

<main class="flex-1 max-w-md w-full mx-auto p-2.5 flex flex-col gap-2.5 pb-10">
  <section class="grid grid-cols-2 gap-2">
    <div class="bg-white rounded-2xl p-3 border border-slate-200"><p class="text-[10px] text-slate-500 font-bold m-0">Total Orders</p><p class="text-lg font-extrabold m-0" id="sTotal">0</p><p class="text-[10px] text-slate-400 m-0" id="sSplit"></p></div>
    <div class="bg-white rounded-2xl p-3 border border-slate-200"><p class="text-[10px] text-slate-500 font-bold m-0">Total Billing (excl. cancelled)</p><p class="text-lg font-extrabold m-0" id="sBill">₹0</p></div>
    <div class="bg-emerald-700 text-white rounded-2xl p-3"><p class="text-[10px] opacity-80 font-bold m-0">Cash Collected (Delivered)</p><p class="text-lg font-extrabold m-0" id="sCash">₹0</p></div>
    <div class="bg-blue-700 text-white rounded-2xl p-3"><p class="text-[10px] opacity-80 font-bold m-0">Cash In Transit (To Collect)</p><p class="text-lg font-extrabold m-0" id="sOnRoad">₹0</p></div>
  </section>
  <div class="bg-white rounded-2xl border border-slate-200 p-1 flex gap-1">
    <button id="v-orders" onclick="setView('orders')" class="flex-1 py-2 rounded-xl text-xs font-extrabold border-none cursor-pointer tab-on">Orders</button>
    <button id="v-riders" onclick="setView('riders')" class="flex-1 py-2 rounded-xl text-xs font-extrabold border-none cursor-pointer bg-transparent text-slate-600">Riders & Cash</button>
  </div>
  <div id="filters" class="bg-white rounded-2xl border border-slate-200 p-1 flex gap-1 overflow-x-auto"></div>
  <div id="list" class="space-y-2.5"></div>
</main>

<script>
const BACKEND_URL="https://gmds-backup-server-2.onrender.com";
const qs=new URLSearchParams(location.search);
let zone=qs.get('zone')||localStorage.getItem('gmds_manager_zone')||'';
let token=localStorage.getItem('gmds_manager_token')||'';
let orders=[],riders=[],known=new Set(),loaded=false,view='orders',filter='all',dateSel='',assigning=null,timer=null;
const FILTERS=[['all','All'],['pending','Pending'],['active','Active'],['delivered','Delivered'],['cancelled','Cancelled']];
const STATUS=['Pending','Confirmed','Accepted','PickedUp','Out for Delivery','Delivered','Cancelled'];
const RIDER_WA_NUMBER="916297474412";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const str=v=>(v===undefined||v===null)?'':String(v).trim();
const pick=(...a)=>a.find(x=>x!==undefined&&x!==null&&x!=='');
const toArray=v=>Array.isArray(v)?v.filter(Boolean):(v&&typeof v==='object'?Object.values(v).filter(Boolean):[]);

/* ---------- Zoom / right-click lock ---------- */
['gesturestart','gesturechange','gestureend','dblclick'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&['+','-','=','0','u','s'].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(e.key.toLowerCase())))e.preventDefault();
});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<=300)e.preventDefault();lastTouch=n},{passive:false});

/* ---------- UI helpers ---------- */
function toast(msg,type){const t=document.createElement('div');t.className=(type==='error'?'bg-red-600':'bg-slate-900')+' text-white px-3.5 py-2.5 rounded-2xl shadow-xl text-xs font-bold';t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3000)}
function beep(){const a=$('snd');if(a){a.currentTime=0;a.play().catch(()=>{})}}
document.body.addEventListener('click',()=>{const a=$('snd');a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})},{once:true});

/* ---------- Auth ---------- */
function boot(){
  if(zone&&token){$('login').style.display='none';$('zoneLbl').textContent=zone;setToday();fetchAll();clearInterval(timer);timer=setInterval(()=>fetchAll(),5000)}
  else{if(qs.get('zone'))$('zoneSel').value=qs.get('zone');$('login').style.display='flex'}
}
function login(){const p=$('pinIn').value.trim();if(!p)return toast('Please enter the Zone PIN.','error');zone=$('zoneSel').value;token=p;localStorage.setItem('gmds_manager_zone',zone);localStorage.setItem('gmds_manager_token',token);boot()}
function logout(){localStorage.removeItem('gmds_manager_zone');localStorage.removeItem('gmds_manager_token');location.href=location.pathname}
const H=()=>({'Content-Type':'application/json','x-manager-token':token,'x-manager-zone':zone});

/* ---------- Data ---------- */
async function fetchAll(manual){
  if(!zone||!token)return;
  try{
    const r=await fetch(`${BACKEND_URL}/api/manager/orders?zone=${encodeURIComponent(zone)}`,{headers:H()});
    if(r.status===401||r.status===403){toast('Invalid PIN. Please log in again.','error');return logout()}
    const j=await r.json();
    if(j.status==='success'&&Array.isArray(j.orders)){
      let n=0;j.orders.forEach(o=>{const u=(o.dbRefType||'core')+':'+oid(o);if(!known.has(u)){known.add(u);if(loaded)n++}});
      loaded=true;if(n){beep();toast(`${n} new order(s) received`)}
      orders=j.orders.slice().sort((a,b)=>orderTime(b)-orderTime(a));render();if(manual)toast(`${orders.length} orders synced`);
    }
    const rr=await fetch(`${BACKEND_URL}/api/manager/riders?zone=${encodeURIComponent(zone)}`,{headers:H()});
    const rj=await rr.json();
    if(rj.status==='success'&&Array.isArray(rj.riders)){riders=rj.riders;$('riderDir').innerHTML='<option value="">-- Select saved rider --</option>'+riders.map(x=>`<option value="${esc(x.phone)}">${esc(x.name)} (+${esc(x.phone)})</option>`).join('')}
  }catch(e){console.error(e)}
}

/* ---------- Order helpers (same logic as the Admin panel) ---------- */
const oid=o=>String(o.orderId||o.id);
const statusOf=o=>str(o.status)||str(o.riderStatus)||'Pending';
function isCancelled(o){const f=o.isCancelled===true||str(o.isCancelled).toLowerCase()==='true'||o.cancelled===true;return f||str(o.status).toLowerCase().includes('cancel')||str(o.riderStatus).toLowerCase().includes('cancel')}
function sKey(o){
  if(isCancelled(o))return 'cancelled';
  const n=s=>s.toLowerCase().replace(/[\s_-]/g,'');const t=n(statusOf(o)),r=n(str(o.riderStatus));
  const done=['delivered','completed','complete','done'];
  if(done.includes(t)||(t!=='pending'&&done.includes(r)&&!str(o.status)))return 'delivered';
  if(t===''||['pending','new','placed'].includes(t))return 'pending';return 'active'}
function orderTime(o){
  const c=Number(o.createdAt);if(c>1e11)return c;
  const m=str(o.orderId||o.id).match(/\d{12,13}/);if(m)return Number(m[0]);
  const ts=Number(o.timestamp);if(ts>1e11)return ts;
  const d=Date.parse(str(o.time)||str(o.timestamp));return isNaN(d)?0:d}
function dateText(o,t){const a=str(o.time);if(a)return a;const b=str(o.timestamp);if(b&&isNaN(Number(b)))return b;return t?new Date(t).toLocaleString('en-IN'):'Time unknown'}
function getKind(o){
  if(o.type==='FoodOrder'||o.items)return 'food';
  if(o.dbRefType==='rider'||o.type==='DeliveryRide'||o.type==='Parcel Delivery'||o.details)return 'ride';
  if(o.type==='HouseService'||o.professional)return 'house';
  if(o.type==='DigitalSeba'||o.category)return 'seba';return 'other'}
const detOf=o=>(o.details&&typeof o.details==='object')?o.details:{};
const total=o=>Number(pick(o.grandTotal,o.totalFare,detOf(o).totalFare,o.price,o.total,0))||0;
const isOnline=o=>str(o.payMode).toUpperCase()==='ONLINE';
const wa91=p=>{let x=str(p).replace(/\D/g,'');if(x.length===10)x='91'+x;return x||RIDER_WA_NUMBER};
function dateOk(o){
  if(!dateSel)return true;
  const t=orderTime(o);
  if(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`===dateSel}
  return String(o.time||o.timestamp||'').includes(dateSel)}
/* Drop-map link: identical to the Admin panel */
function getMapLink(o){
  if(str(o.gpsLocation).includes('http'))return o.gpsLocation;
  if(str(o.location).includes('http'))return o.location;
  if(o.lat&&o.lng)return `https://maps.google.com/?q=${o.lat},${o.lng}`;
  return 'Not Provided'}
function rideMaps(o){
  const d=detOf(o);
  const pLat=pick(d.pickupLat,o.pickupLat,''),pLng=pick(d.pickupLng,o.pickupLng,''),dLat=pick(d.dropLat,o.dropLat,''),dLng=pick(d.dropLng,o.dropLng,'');
  return{pick:(pLat!==''&&pLng!=='')?`https://www.google.com/maps/search/?api=1&query=${pLat},${pLng}`:'Not Provided',
         drop:(dLat!==''&&dLng!=='')?`https://www.google.com/maps/search/?api=1&query=${dLat},${dLng}`:'Not Provided'}}
const hotelMap=h=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h)}`;
function riderOf(o){let n=o.riderName||o.assignedRider;if(n&&typeof n==='object')n=n.name||n.riderName||'';return{name:str(n),phone:str(o.riderPhone)}}

/* ---------- Render ---------- */
function setView(v){view=v;
  $('v-orders').className='flex-1 py-2 rounded-xl text-xs font-extrabold border-none cursor-pointer '+(v==='orders'?'tab-on':'bg-transparent text-slate-600');
  $('v-riders').className='flex-1 py-2 rounded-xl text-xs font-extrabold border-none cursor-pointer '+(v==='riders'?'tab-on':'bg-transparent text-slate-600');
  $('filters').style.display=v==='orders'?'flex':'none';render()}
function setDate(v){dateSel=v;$('dateIn').value=v;render()}
function setToday(){const d=new Date(),p=n=>String(n).padStart(2,'0');setDate(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`)}
function setFilter(f){filter=f;render()}
function render(){
  const day=orders.filter(dateOk),live=day.filter(o=>sKey(o)!=='cancelled');
  const done=day.filter(o=>sKey(o)==='delivered'),road=day.filter(o=>sKey(o)==='active');
  $('sTotal').textContent=day.length;
  $('sSplit').textContent=`Food ${day.filter(o=>getKind(o)==='food').length} • Ride/Parcel ${day.filter(o=>getKind(o)==='ride').length}`;
  $('sBill').textContent='₹'+live.reduce((s,o)=>s+total(o),0);
  $('sCash').textContent='₹'+done.filter(o=>!isOnline(o)).reduce((s,o)=>s+total(o),0);
  $('sOnRoad').textContent='₹'+road.filter(o=>!isOnline(o)).reduce((s,o)=>s+total(o),0);
  $('filters').innerHTML=FILTERS.map(([k,l])=>`<button onclick="setFilter('${k}')" class="px-3 py-1.5 text-[11px] font-extrabold rounded-xl border-none cursor-pointer whitespace-nowrap ${filter===k?'tab-on':'bg-transparent text-slate-600'}">${l} (${day.filter(o=>k==='all'||sKey(o)===k).length})</button>`).join('');
  $('list').innerHTML=view==='orders'?renderOrders(day):renderRiders(day)}

function renderRiders(day){
  const m={};
  day.forEach(o=>{const rd=riderOf(o);if(!rd.name)return;const k=rd.phone||rd.name;
    const r=m[k]=m[k]||{name:rd.name,phone:rd.phone,done:0,cash:0,road:[],roadCash:0};const s=sKey(o);
    if(s==='delivered'){r.done++;if(!isOnline(o))r.cash+=total(o)}
    else if(s==='active'){r.road.push(o);if(!isOnline(o))r.roadCash+=total(o)}});
  const ks=Object.keys(m);
  if(!ks.length)return `<div class="bg-white rounded-2xl p-8 text-center text-xs font-bold text-slate-400">No riders assigned for this date.</div>`;
  return ks.map(k=>{const r=m[k],w=r.phone?wa91(r.phone):'';
    return `<div class="bg-white rounded-2xl p-3.5 border border-slate-200">
      <div class="flex justify-between items-start gap-2"><div><p class="font-extrabold text-sm m-0">${esc(r.name)}</p>
        ${r.phone?`<a href="tel:${esc(r.phone)}" class="text-[11px] font-bold text-blue-600 no-underline"><i class="fas fa-phone-alt"></i> ${esc(r.phone)}</a>`:''}</div>
        ${w?`<a href="https://wa.me/${w}" target="_blank" class="w-9 h-9 rounded-xl bg-[#25D366] text-white flex items-center justify-center no-underline"><i class="fab fa-whatsapp"></i></a>`:''}</div>
      <div class="grid grid-cols-3 gap-1.5 mt-2.5 text-center">
        <div class="bg-emerald-50 rounded-xl p-2"><p class="text-[9px] text-slate-500 font-bold m-0">Delivered</p><p class="font-extrabold m-0">${r.done}</p></div>
        <div class="bg-emerald-50 rounded-xl p-2"><p class="text-[9px] text-slate-500 font-bold m-0">Cash Collected</p><p class="font-extrabold m-0">₹${r.cash}</p></div>
        <div class="bg-blue-50 rounded-xl p-2"><p class="text-[9px] text-slate-500 font-bold m-0">Cash In Hand</p><p class="font-extrabold m-0">₹${r.roadCash}</p></div></div>
      ${r.road.length?`<div class="mt-2.5 bg-slate-50 rounded-xl p-2.5 space-y-1"><p class="text-[10px] font-extrabold text-slate-500 m-0">Currently carrying (${r.road.length}):</p>`+
        r.road.map(o=>`<div class="text-[11px] font-bold">#${esc(oid(o))} • ${esc(o.user||o.customer||'Customer')} • ₹${total(o)} <span class="text-slate-400 font-normal">(${esc(statusOf(o))})</span></div>`).join('')+`</div>`:''}
    </div>`}).join('')}

function renderOrders(day){
  const list=day.filter(o=>filter==='all'||sKey(o)===filter);
  if(!list.length)return `<div class="bg-white rounded-2xl p-10 text-center text-xs font-bold text-slate-400"><i class="fas fa-box-open text-2xl block mb-2"></i>No orders found.</div>`;
  return list.map(o=>{
    try{return renderCard(o)}catch(e){return `<div class="bg-red-50 rounded-2xl p-3 text-xs font-bold text-red-600">Could not display order #${esc(oid(o))}</div>`}}).join('')}

function renderCard(o){
  const id=oid(o),d=detOf(o),sk=sKey(o),kind=getKind(o),st=statusOf(o),t=orderTime(o);
  let badge,body='';
  if(kind==='food'){badge=['Food','bg-emerald-50 text-emerald-700'];
    body=toArray(o.items).map(i=>`<div class="text-[11px] font-bold">• ${esc(i.name)} × ${esc(i.qty||1)} <span class="text-slate-400 font-normal">(${esc(i.hotel||'GMDS Partner')})</span></div>`).join('');
    const dm=getMapLink(o);if(dm.startsWith('http'))body+=`<a href="${esc(dm)}" target="_blank" class="inline-block text-[10px] font-black text-red-600 mt-1 no-underline"><i class="fas fa-location-dot"></i> Drop Map</a>`}
  else if(kind==='ride'){badge=[str(pick(d.type,o.type,'Ride / Parcel')),'bg-blue-50 text-blue-700'];
    const mp=rideMaps(o);
    body=`<div class="text-[11px] font-semibold">Pick-up: ${esc(pick(d.pickup,o.pickup,o.pickupLocation,'N/A'))} ${mp.pick.startsWith('http')?`<a href="${esc(mp.pick)}" target="_blank" class="text-emerald-700 font-black no-underline">[Map]</a>`:''}</div>
          <div class="text-[11px] font-semibold">Drop-off: ${esc(pick(d.drop,o.drop,o.dropLocation,'N/A'))} ${mp.drop.startsWith('http')?`<a href="${esc(mp.drop)}" target="_blank" class="text-red-600 font-black no-underline">[Map]</a>`:''}</div>`}
  else{badge=[kind==='house'?'House Service':kind==='seba'?'Digital Seba':'Order','bg-purple-50 text-purple-700'];body=`<div class="text-[11px] font-bold">${esc(o.service||o.problem||o.category||'Booking')}</div>`}
  const rd=riderOf(o),rw=rd.phone?wa91(rd.phone):'';
  const rider=rd.name?`<span class="text-indigo-700 font-black">${esc(rd.name)}</span>${rd.phone?` <a href="tel:${esc(rd.phone)}" class="text-blue-600 text-[10px]">(${esc(rd.phone)})</a>`:''}${rw?` <a href="https://wa.me/${rw}" target="_blank" class="text-[#25D366]"><i class="fab fa-whatsapp"></i></a>`:''}`:'<span class="text-slate-400 font-bold">Unassigned</span>';
  const opts=STATUS.slice();if(!opts.some(s=>s.toLowerCase()===st.toLowerCase()))opts.unshift(st);
  const recv=pick(o.receiverPhone,d.receiverPhone,'');
  return `<div class="card ${sk} bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200">
    <div class="flex justify-between items-start mb-2"><div><span class="font-mono text-xs font-black">#${esc(id)}</span> <span class="text-[9px] text-slate-400 font-bold">${esc(dateText(o,t))}</span></div>
      <span class="px-2 py-0.5 rounded-md text-[9px] font-black ${badge[1]}">${esc(badge[0])}</span></div>
    <div class="font-extrabold text-xs">${esc(o.user||o.customer||'Customer')}</div>
    <a href="tel:${esc(o.phone)}" class="text-[11px] font-bold text-blue-600 no-underline"><i class="fas fa-phone-alt text-[9px]"></i> ${esc(o.phone||'N/A')}</a>
    ${recv?`<div class="text-[11px] font-bold text-slate-600">Receiver: <a href="tel:${esc(recv)}" class="text-blue-600 no-underline">${esc(recv)}</a></div>`:''}
    ${o.address?`<div class="text-[11px] text-slate-600 mt-0.5">${esc(o.address)}</div>`:''}
    <div class="bg-slate-50 rounded-xl p-2.5 my-2 space-y-0.5">${body}</div>
    <div class="flex justify-between items-center pt-2 border-t border-slate-100">
      <div><p class="text-[9px] text-slate-400 font-bold m-0">TOTAL</p><p class="text-sm font-black m-0">₹${total(o)} <span class="text-[9px] ${isOnline(o)?'text-emerald-600':'text-amber-600'}">(${isOnline(o)?'PAID ONLINE':esc(o.payMode||'COD')})</span></p></div>
      <div class="text-right"><p class="text-[9px] text-slate-400 font-bold m-0">RIDER</p><div class="text-[11px]">${rider}</div></div></div>
    ${sk==='cancelled'?`<div class="mt-2.5 bg-red-50 text-red-600 border border-red-200 rounded-xl py-2 text-center text-[11px] font-black">CANCELLED</div>`:`
    <div class="grid grid-cols-2 gap-1.5 mt-2.5">
      <select onchange="setStatus('${esc(id)}',this.value)" class="border border-slate-200 rounded-xl text-[11px] font-extrabold px-2.5 py-2 outline-none">${opts.map(s=>`<option ${s.toLowerCase()===st.toLowerCase()?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <button onclick="openRider('${esc(id)}')" class="bg-slate-100 text-slate-700 rounded-xl font-extrabold text-[11px] border-none cursor-pointer"><i class="fas fa-motorcycle"></i> Assign Rider</button></div>`}
    <button onclick="openWa('${esc(id)}')" class="w-full mt-1.5 bg-[#25D366] text-white py-2.5 rounded-xl font-extrabold text-[11px] border-none cursor-pointer"><i class="fab fa-whatsapp"></i> WhatsApp Dispatch</button>
  </div>`}

/* ---------- Actions ---------- */
const find=id=>orders.find(o=>oid(o)===String(id));
async function post(body){const r=await fetch(`${BACKEND_URL}/api/manager/update-status`,{method:'POST',headers:H(),body:JSON.stringify(body)});return r.json()}
async function setStatus(id,status){const o=find(id);if(!o)return;
  try{const j=await post({orderId:id,dbRefType:o.dbRefType||'core',dbPath:o.dbPath||'all_orders',status,zone});
    if(j.status==='success'){toast(`Order #${id} updated to ${status}`);fetchAll()}else toast(j.message||'Status update failed','error')}catch(e){toast('Network error while updating status','error')}}
function openRider(id){const o=find(id);if(!o)return;assigning=o;const r=riderOf(o);$('riderOrderLbl').textContent='Order #'+id;$('rName').value=r.name;$('rPhone').value=r.phone;$('riderModal').style.display='flex'}
function closeRider(){$('riderModal').style.display='none';assigning=null}
function pickDirRider(p){const r=riders.find(x=>x.phone===p);if(r){$('rName').value=r.name;$('rPhone').value=r.phone;if(r.vehicle)$('rVeh').value=r.vehicle}}
async function saveRider(){if(!assigning)return;
  const n=$('rName').value.trim(),p=$('rPhone').value.replace(/\D/g,'').slice(-10);
  if(!n||p.length!==10)return toast('Enter a valid rider name and 10-digit phone number.','error');
  try{const o=assigning,j=await post({orderId:o.orderId||o.id,dbRefType:o.dbRefType||'core',dbPath:o.dbPath||'all_orders',status:'Accepted',riderName:n,riderPhone:p,riderVehicle:$('rVeh').value,zone});
    if(j.status==='success'){toast(`Rider ${n} assigned`);closeRider();fetchAll()}else toast(j.message||'Assignment failed','error')}catch(e){toast('Network error while assigning rider','error')}}

/* ---------- WhatsApp message (same format as the Admin panel) ---------- */
function buildWa(order){
  const SEP='-----------------------------------\n',oId=oid(order),kind=getKind(order),d=detOf(order),mapLink=getMapLink(order);
  let text='';
  if(kind==='food'){
    const items=toArray(order.items);
    text+=`*📦 NEW FOOD ORDER - GMDS*\n*🆔 Order ID:* ${oId}\n`+SEP+`*🟢 PICK-UP LOCATION(S):*\n`;
    [...new Set(items.map(i=>i.hotel||'GMDS Partner'))].forEach(h=>{text+=`🏪 *${h}*\n📍 Hotel Map: ${hotelMap(h)}\n`});
    text+=SEP+`*🔴 CUSTOMER DROP-OFF:*\n*👤 Customer:* ${order.user||order.customer||'Unknown'}\n*📞 Phone:* ${order.phone||'N/A'}\n`;
    if(order.remoteOrder&&order.receiverPhone)text+=`*📱 Receiver Phone:* ${order.receiverPhone} (Family Order)\n`;
    text+=`*🏠 Address:* ${order.address||'N/A'}\n*📍 Drop Map:* ${mapLink}\n`;
    if(order.distance)text+=`*📏 Distance:* ${order.distance}\n`;
    if(order.routeMap)text+=`*🗺️ Route Map:* ${order.routeMap}\n`;
    text+=SEP+`*🛒 Order Details:*\n`;
    items.forEach(i=>{const q=i.qty||1;text+=`• *${i.name}* (Qty: ${q} x ₹${i.price||0}) = *₹${(Number(i.price)||0)*Number(q)}*\n  Hotel: _${i.hotel||'GMDS Partner'}_\n\n`});
    text+=SEP+`*💵 ITEM TOTAL:* ₹${order.subtotal||0}\n*🛵 DELIVERY CHARGE:* ₹${order.deliveryFee||0}\n*💰 GRAND TOTAL TO PAY:* ₹${order.grandTotal||order.total||0}\n*💳 PAYMENT MODE:* ${order.payMode||'COD'}\n`;
    if(isOnline(order)&&(order.razorpayPaymentId||order.txnId))text+=`*✅ PAID ONLINE - TXN ID:* ${order.razorpayPaymentId||order.txnId}\n`;
    text+=SEP+`_Please pick up and deliver on time._`;
  }else if(kind==='ride'){
    const sType=str(pick(d.type,order.type,'RIDE BOOKING')),mp=rideMaps(order);
    text+=`*🚀 GMDS NEW ${sType.toUpperCase()}*\n*🆔 Order ID:* ${oId}\n`+SEP+`*👤 Name:* ${order.customer||order.user||'Unknown'}\n*📞 Phone:* ${order.phone||'N/A'}\n\n`;
    text+=`*🟢 Pick-up:* ${pick(d.pickup,order.pickup,order.pickupLocation,'N/A')}\n*📍 Pick-up Map:* ${mp.pick}\n\n`;
    text+=`*🔴 Drop-off:* ${pick(d.drop,order.drop,order.dropLocation,'N/A')}\n*📍 Drop-off Map:* ${mp.drop}\n\n`;
    text+=`*🛣️ Distance:* ${pick(d.distance,order.distance,'N/A')}\n\n`;
    if(sType.toLowerCase().includes('parcel'))text+=`*📦 Item:* ${pick(d.itemName,order.itemName,'Item')}\n*📱 Receiver:* ${pick(d.receiverPhone,order.receiverPhone,'N/A')}\n`;
    else text+=`*👥 Passengers:* ${pick(d.passengers,order.passengers,1)} Person(s)\n*🛵 Vehicle:* ${pick(d.vehicle,'Bike')}\n`;
    text+=SEP+`*💰 TOTAL AMOUNT:* ₹${pick(d.totalFare,order.totalFare,order.price,order.grandTotal,0)}\n*💳 PAYMENT MODE:* ${order.payMode||'COD'}\n`;
    if(isOnline(order)&&(order.razorpayPaymentId||order.txnId))text+=`*✅ PAID ONLINE - TXN ID:* ${order.razorpayPaymentId||order.txnId}\n`;
    text+=SEP+`_Please pick up and deliver on time._`;
  }else if(kind==='seba'){
    text+=`*💻 GMDS DIGITAL SEBA BOOKING*\n*🆔 Order ID:* ${oId}\n`+SEP+`*👤 Customer:* ${order.customer||order.user||'Unknown'}\n*📞 Phone:* ${order.phone||'N/A'}\n*📍 Map Link:* ${mapLink}\n`+SEP+`*🛠️ Service Type:* ${order.service||'N/A'}\n*📁 Category:* ${order.category||'N/A'}\n`+SEP+`*💰 ESTIMATED CHARGE:* ${order.price||'Variable'}\n*💳 PAYMENT MODE:* ${order.payMode||'COD'}\n`+SEP+`_Please process the request._`;
  }else if(kind==='house'){
    const salon=order.problem==='N/A'||(order.service&&String(order.service).toLowerCase().includes('salon'));
    text+=`*${salon?'✂️ VIP SALON APPOINTMENT':'🔧 GMDS REPAIR SERVICE'}*\n*🆔 Order ID:* ${oId}\n`+SEP+`*👤 Customer:* ${order.customer||order.user||'Unknown'}\n*📞 Phone:* ${order.phone||'N/A'}\n*📍 Map Link:* ${mapLink}\n`+SEP+`*⚙️ Service Type:* ${order.service||'N/A'}\n`;
    text+=salon?`*💈 Salon Name:* ${order.professional||'N/A'}\n*📍 Salon Map:* ${hotelMap(order.professional||'')}\n`:`*📝 Problem Details:* ${order.problem||'N/A'}\n*👨‍🔧 Assigned To:* ${order.professional||'GMDS Expert'}\n`;
    text+=`*📅 Date & Time:* ${order.appointmentTime||'N/A'}\n`+SEP+`_Please confirm the booking._`;
  }else{
    text+=`*📋 GMDS ORDER*\n*🆔 Order ID:* ${oId}\n`+SEP+`*👤 Customer:* ${order.customer||order.user||'Unknown'}\n*📞 Phone:* ${order.phone||'N/A'}\n*💰 Amount:* ₹${total(order)}\n*💳 Payment:* ${order.payMode||'COD'}\n`;
  }
  return text.trim()}
function openWa(id){const o=find(id);if(!o)return;
  $('waText').value=buildWa(o);const n=wa91(riderOf(o).phone);
  $('waTarget').textContent='Dispatching to: +'+n;
  $('waSend').onclick=()=>window.open(`https://wa.me/${n}?text=${encodeURIComponent($('waText').value)}`,'_blank');
  $('waModal').style.display='flex'}
function closeWa(){$('waModal').style.display='none'}
function copyWa(){const t=$('waText');t.select();try{document.execCommand('copy');toast('Dispatch message copied')}catch(e){}}

boot();
</script>
</body>
</html>
